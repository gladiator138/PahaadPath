name: open data
# Run by hand: roadside stops (fuel, hospitals, ATMs, mechanics) near each town from OpenStreetMap, committed to the
# branch it runs on as data/osm_stops.json and baked into the app by the next build. Also prints the start of the NDMA
# Sachet public alert feed, so its format can be checked before the data pack uses it.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  opendata:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cd python && python -u -m pahaadpath stops --out ../data/osm_stops.json
      - name: Sachet alert feed (look only)
        continue-on-error: true
        run: |
          for u in https://sachet.ndma.gov.in/cap_public_website/rss/rss_india.xml https://sachet.ndma.gov.in/cap_public_website/rss/rss_uttarakhand.xml; do
            echo "== $u"; curl -sS -m 60 -A pahaadpath-pipeline -w '\nHTTP %{http_code} %{content_type} %{size_download} bytes\n' "$u" | head -c 4000; echo
          done
      - name: Commit the stops file to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git add data/osm_stops.json
          git diff --cached --quiet && echo 'no change' && exit 0
          git commit -qm "OpenStreetMap stops near each town ($(date -u +%Y-%m-%d))"
          git push -q origin HEAD:${{ github.ref_name }}

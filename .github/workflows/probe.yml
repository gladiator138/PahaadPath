name: probe closure sources
# temporary: fetch a few PWD SRMD reports as text and word boxes, committed under probe_data/ for writing the parser
on:
  push:
    branches: [claude/project-thread-k1o0bg]
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq >/dev/null; sudo apt-get install -y -qq poppler-utils >/dev/null; pdftotext -v 2>&1 | head -1
      - run: |
          mkdir -p probe_data; cd probe_data
          for p in 1 6 8; do curl -sSL -m 60 -A 'Mozilla/5.0' https://pwd.uk.gov.in/document-category/srmd-daily-reports-2026/page/$p -o list$p.html; done
          cat list*.html | grep -oE '>SRMD[^<]*<|https://cdnbbsr[^"]+\.pdf' > listing.txt; rm list*.html
          for u in https://cdnbbsr.s3waas.gov.in/s31e0a84051e6a4a7381473328f43c4884/uploads/2026/08/20260819190059234.pdf \
                   https://cdnbbsr.s3waas.gov.in/s31e0a84051e6a4a7381473328f43c4884/uploads/2026/09/202609301999916866.pdf \
                   https://cdnbbsr.s3waas.gov.in/s31e0a84051e6a4a7381473328f43c4884/uploads/2026/08/202608311866634785.pdf; do
            n=$(basename $u .pdf); curl -sSL -m 120 -A 'Mozilla/5.0' $u -o $n.pdf
            pdfinfo $n.pdf > $n.info; pdftotext -layout $n.pdf $n.txt; pdftotext -tsv $n.pdf $n.tsv; pdftotext -raw $n.pdf $n.raw.txt; rm $n.pdf
          done
          gzip -9 *.tsv *.txt; ls -l
          cd ..; git config user.name 'github-actions[bot]'; git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git add probe_data; git commit -qm "Probe data: three PWD SRMD reports as text (temporary)"; git push -q origin HEAD:${GITHUB_REF_NAME}
